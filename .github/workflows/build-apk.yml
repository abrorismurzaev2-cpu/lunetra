name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA (non-interactive)
        run: |
          mkdir -p twa && cd twa
          
          # Generate keystore first
          keytool -genkeypair -v -keystore ./android.keystore -alias lunetra \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lunetra123 -keypass lunetra123 \
            -dname "CN=Lunetra, OU=App, O=Lunetra, L=Moscow, ST=Moscow, C=RU"

          # Create twa-manifest.json manually (full control)
          cat > twa-manifest.json << 'EOF'
          {
            "packageId": "app.lunetra.finance",
            "host": "abrorismurzaev2-cpu.github.io",
            "name": "Lunetra",
            "launcherName": "Lunetra",
            "display": "standalone",
            "themeColor": "#0B0B0E",
            "themeColorDark": "#0B0B0E",
            "navigationColor": "#0B0B0E",
            "navigationColorDark": "#0B0B0E",
            "navigationDividerColor": "#0B0B0E",
            "navigationDividerColorDark": "#0B0B0E",
            "backgroundColor": "#0B0B0E",
            "enableNotifications": false,
            "startUrl": "/lunetra/",
            "iconUrl": "https://abrorismurzaev2-cpu.github.io/lunetra/icons/icon-512.png",
            "maskableIconUrl": "https://abrorismurzaev2-cpu.github.io/lunetra/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "lunetra"
            },
            "appVersionName": "1.2.0",
            "appVersionCode": 12,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://abrorismurzaev2-cpu.github.io/lunetra/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {"enabled": false},
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://abrorismurzaev2-cpu.github.io/lunetra/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "protocolHandlers": [],
            "fileHandlers": [],
            "launchHandlerClientMode": "auto"
          }
          EOF

          # Use bubblewrap to generate Android project from manifest
          bubblewrap update --skipPwaValidation || true
          # init from existing manifest
          yes "" | bubblewrap init --manifest=https://abrorismurzaev2-cpu.github.io/lunetra/manifest.json --directory=. 2>&1 | tail -30 || true
          
          # If project not generated, use bubblewrap doctor / merge
          ls -la
          cat twa-manifest.json | head -20

      - name: Build with passwords via expect
        run: |
          cd twa
          sudo apt-get update -qq && sudo apt-get install -y -qq expect
          
          # Accept Android licenses
          mkdir -p "$HOME/android-sdk/licenses"
          echo -e "\n24333f8a63b6825ea9c5514fbe7619360cde910babc0042aef66f5b304e65a9f" > "$HOME/android-sdk/licenses/android-sdk-license"
          echo -e "\n84831b9409646161bbf9b4254b7b14cef9caf5d1" > "$HOME/android-sdk/licenses/android-sdk-preview-license"
          
          export BUBBLEWRAP_KEYSTORE_PASSWORD=lunetra123
          export BUBBLEWRAP_KEY_PASSWORD=lunetra123
          
          # expect script for interactive prompts
          cat > /tmp/build.exp << 'EXPECT'
          set timeout 600
          spawn bubblewrap build --skipPwaValidation
          expect {
            -re "(?i)password" { send "lunetra123\r"; exp_continue }
            -re "(?i)Password" { send "lunetra123\r"; exp_continue }
            -re "(?i)keystore" { send "lunetra123\r"; exp_continue }
            -re "(?i)yes/no" { send "yes\r"; exp_continue }
            -re "(?i)y/n" { send "y\r"; exp_continue }
            eof
          }
          EXPECT
          expect /tmp/build.exp || true
          
          # Also try direct gradle if project exists
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/android.keystore \
              -Pandroid.injected.signing.store.password=lunetra123 \
              -Pandroid.injected.signing.key.alias=lunetra \
              -Pandroid.injected.signing.key.password=lunetra123 || true
          fi
          
          echo "=== Looking for APK ==="
          find . -name "*.apk" -type f 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lunetra-apk
          path: |
            twa/**/*.apk
            **/*.apk
          if-no-files-found: warn

      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk-v1.2.0
          name: Lunetra APK v1.2.0
          body: "Android APK for Lunetra. Package: app.lunetra.finance"
          files: "**/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
