name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp
          rm -rf $SDK/cmdline-tools/latest
          mv /tmp/cmdline-tools $SDK/cmdline-tools/latest
          export ANDROID_HOME=$SDK
          export ANDROID_SDK_ROOT=$SDK
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK --licenses >/tmp/licenses.txt 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV

      - name: Build Release APK
        working-directory: android
        run: |
          # Single source of truth for SDK path
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Clear conflicting vars
          unset ANDROID_SDK_ROOT || true
          export ANDROID_HOME=$ANDROID_HOME
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dandroid.sdk.path=$ANDROID_HOME \
            -Pandroid.sdk.path=$ANDROID_HOME
          find app/build/outputs -name "*.apk" -type f -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lunetra-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-android
          name: Lunetra APK v1.2.0
          body: |
            ## Lunetra Android APK v1.2.0
            Package: `app.lunetra.finance`
            Скачайте **app-release.apk** ниже.
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
