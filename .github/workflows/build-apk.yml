name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Create TWA project
        run: |
          mkdir -p twa && cd twa
          keytool -genkeypair -keystore android.keystore -alias lunetra \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lunetra123 -keypass lunetra123 \
            -dname "CN=Lunetra,O=Lunetra,C=RU" -noprompt

          set +e
          printf 'app.lunetra.finance\nLunetra\nLunetra\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n' | \
            bubblewrap init --manifest=https://abrorismurzaev2-cpu.github.io/lunetra/manifest.json 2>&1 | tee init.log
          set -e
          ls -la
          if [ -f twa-manifest.json ]; then
            python3 -c "
          import json
          from pathlib import Path
          p=Path('twa-manifest.json')
          m=json.loads(p.read_text())
          m['signingKey']={'path':'./android.keystore','alias':'lunetra'}
          m['packageId']=m.get('packageId') or 'app.lunetra.finance'
          p.write_text(json.dumps(m,indent=2))
          print('ok', m.get('packageId'))
          "
          fi

      - name: Build APK
        run: |
          cd twa
          set +e
          printf 'lunetra123\nlunetra123\n' | timeout 1200 bubblewrap build --skipPwaValidation 2>&1 | tee build.log
          set -e
          find . -name '*.apk' -type f -ls || true
          if [ -f gradlew ] && ! find . -name '*.apk' | grep -q .; then
            chmod +x gradlew
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/android.keystore \
              -Pandroid.injected.signing.store.password=lunetra123 \
              -Pandroid.injected.signing.key.alias=lunetra \
              -Pandroid.injected.signing.key.password=lunetra123 2>&1 | tee gradle.log
            find . -name '*.apk' -type f -ls || true
          fi
          find . -name '*.apk' -type f | grep -q . || (tail -80 build.log; exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lunetra-APK
          path: |
            twa/**/*.apk
            **/*signed*.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-android
          name: Lunetra Android APK v1.2.0
          body: "Package app.lunetra.finance — для RuStore"
          files: twa/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
