name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        working-directory: android
        run: |
          # Install gradle wrapper if needed
          gradle wrapper --gradle-version 8.2 || true
          chmod +x gradlew 2>/dev/null || true
          
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi
          
          echo "=== APK files ==="
          find . -name "*.apk" -type f -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lunetra-APK
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/**/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-android
          name: Lunetra APK v1.2.0
          body: |
            ## Lunetra Android APK
            - Package ID: `app.lunetra.finance`
            - Version: 1.2.0
            - WebView app → https://abrorismurzaev2-cpu.github.io/lunetra/
            
            Скачайте APK из Assets ниже и установите на телефон.
            Для RuStore загрузите этот же файл.
          files: android/app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
